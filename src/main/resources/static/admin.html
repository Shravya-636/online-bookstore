<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - BookStore</title>

    <link
        rel="stylesheet"
        href="/css/style.css">

</head>

<body>

<header class="header">

    <div class="logo">
        📚 BookStore Admin
    </div>

    <nav>

        <a href="/">
            Store
        </a>

        <button
            class="logout-button"
            onclick="logout()">

            Logout

        </button>

    </nav>

</header>


<main class="admin-page">

    <h1>
        Book Management
    </h1>


    <!-- Add / Edit Book -->

    <section class="admin-form">

        <h2 id="formTitle">
            Add New Book
        </h2>


        <input
            type="hidden"
            id="bookId">


        <label>
            Title
        </label>

        <input
            type="text"
            id="title"
            placeholder="Book title">


        <label>
            Author
        </label>

        <input
            type="text"
            id="author"
            placeholder="Author">


        <label>
            Category
        </label>

        <input
            type="text"
            id="category"
            placeholder="Category">


        <label>
            Price
        </label>

        <input
            type="number"
            id="price"
            placeholder="Price">


        <label>
            Stock
        </label>

        <input
            type="number"
            id="stock"
            placeholder="Stock">


        <label>
            Description
        </label>

        <textarea
            id="description"
            placeholder="Book description">
        </textarea>


        <button
            onclick="saveBook()"
            id="saveButton">

            Add Book

        </button>


        <button
            onclick="resetForm()"
            id="cancelButton"
            style="display:none;">

            Cancel

        </button>

    </section>


    <!-- Books -->

    <section>

        <h2>
            Inventory
        </h2>

        <div id="adminBooks">
            Loading books...
        </div>

    </section>

</main>


<script src="/js/admin.js"></script>

</body>

</html>
